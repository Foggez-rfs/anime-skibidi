<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Anime vs Skibidi PvP</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; font-family: Arial; color: white; padding: 20px; text-align: center; }
        button { padding: 15px; margin: 10px; font-size: 18px; border-radius: 12px; border: none; cursor: pointer; }
        .create-btn { background: #2ecc71; color: white; }
        .join-btn { background: #3498db; color: white; }
        input { padding: 15px; font-size: 18px; margin: 10px; border-radius: 12px; border: none; text-align: center; }
        #status { margin-top: 20px; padding: 10px; background: rgba(0,0,0,0.5); border-radius: 12px; }
    </style>
</head>
<body>
    <h1>⚔️ Anime vs Skibidi PvP ⚔️</h1>
    <button id="createBtn" class="create-btn">✨ СОЗДАТЬ КОМНАТУ</button>
    <div id="roomCodeDisplay" style="display:none; margin-top:20px;">
        <h3>📋 Код комнаты:</h3>
        <div style="font-size:32px; letter-spacing:4px; background:#000; padding:15px; border-radius:12px;" id="roomCode"></div>
        <button id="copyBtn">📋 Копировать</button>
    </div>
    <div style="margin-top:30px;">
        <h3>🔗 ПРИСОЕДИНИТЬСЯ</h3>
        <input type="text" id="roomInput" placeholder="Введите код" maxlength="6">
        <button id="joinBtn" class="join-btn">ПРИСОЕДИНИТЬСЯ</button>
    </div>
    <div id="status">⚡ Готов к бою</div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        // ПОДКЛЮЧЕНИЕ К ТВОЕМУ СЕРВЕРУ
        const socket = io('https://anime-skibidi.onrender.com');
        
        let currentRoomId = null;

        socket.on('connect', () => {
            document.getElementById('status').innerHTML = '✅ Подключено к серверу';
        });

        socket.on('roomCreated', (roomId) => {
            currentRoomId = roomId;
            document.getElementById('roomCodeDisplay').style.display = 'block';
            document.getElementById('roomCode').innerText = roomId;
            document.getElementById('status').innerHTML = `✅ Комната создана: ${roomId}`;
        });

        socket.on('gameStart', () => {
            document.getElementById('status').innerHTML = '🎮 ИГРА НАЧАЛАСЬ! БОЙ! 🎮';
        });

        socket.on('error', (msg) => {
            document.getElementById('status').innerHTML = `❌ ${msg}`;
        });

        document.getElementById('createBtn').onclick = () => {
            socket.emit('createRoom');
            document.getElementById('status').innerHTML = '📡 Создаём комнату...';
        };

        document.getElementById('joinBtn').onclick = () => {
            const roomId = document.getElementById('roomInput').value.trim().toUpperCase();
            if (roomId) {
                socket.emit('joinRoom', roomId);
                document.getElementById('status').innerHTML = `📡 Подключаемся к комнате ${roomId}...`;
            }
        };

        document.getElementById('copyBtn').onclick = () => {
            navigator.clipboard.writeText(currentRoomId);
            document.getElementById('status').innerHTML = '📋 Код скопирован!';
        };
    </script>
</body>
</html>
