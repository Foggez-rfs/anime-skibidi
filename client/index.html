<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Anime vs Skibidi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            padding: 16px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.5);
            padding: 12px 20px;
            border-radius: 16px;
            margin-bottom: 20px;
        }
        .currency { display: flex; gap: 16px; }
        .coin, .gem { background: rgba(0,0,0,0.5); padding: 6px 14px; border-radius: 20px; }
        .coin { color: #f1c40f; }
        .gem { color: #3498db; }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn {
            background: rgba(0,0,0,0.5);
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            color: white;
            cursor: pointer;
        }
        .tab-btn.active { background: linear-gradient(45deg, #667eea, #764ba2); }
        .panel { display: none; background: rgba(0,0,0,0.5); border-radius: 20px; padding: 20px; }
        .panel.active { display: block; }
        .arena { background: linear-gradient(135deg, #2c1810, #1a0f0a); border-radius: 20px; padding: 20px; position: relative; }
        .vs { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 48px; color: #ff6b6b; }
        .characters { display: flex; justify-content: space-between; gap: 30px; }
        .character-card { flex: 1; background: rgba(0,0,0,0.6); border-radius: 16px; padding: 16px; text-align: center; }
        .hp-bar { width: 100%; height: 24px; background: #2c3e50; border-radius: 12px; overflow: hidden; margin: 10px 0; }
        .hp-fill { height: 100%; background: linear-gradient(90deg, #e74c3c, #c0392b); transition: width 0.3s; display: flex; align-items: center; justify-content: center; font-size: 12px; }
        .controls { display: flex; justify-content: center; gap: 20px; margin-top: 30px; }
        .attack-btn { background: #e74c3c; padding: 12px 24px; border: none; border-radius: 12px; color: white; font-weight: bold; cursor: pointer; }
        .medkit-btn { background: #2ecc71; padding: 12px 24px; border: none; border-radius: 12px; color: white; font-weight: bold; cursor: pointer; }
        .bot-btn { background: #3498db; padding: 12px 24px; border: none; border-radius: 12px; color: white; font-weight: bold; cursor: pointer; width: 100%; margin-top: 20px; }
        .reset-btn { background: #e67e22; padding: 12px 24px; border: none; border-radius: 12px; color: white; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        .turn-indicator { text-align: center; margin: 15px 0; font-size: 20px; font-weight: bold; }
        .message { text-align: center; margin-top: 15px; padding: 10px; background: rgba(0,0,0,0.5); border-radius: 10px; }
        .cases-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        .case-card { background: rgba(0,0,0,0.6); border-radius: 16px; padding: 20px; text-align: center; cursor: pointer; }
        .case-card.premium { border: 2px solid gold; }
        .case-icon { font-size: 60px; }
        .inventory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; margin-top: 20px; }
        .inventory-item { background: rgba(0,0,0,0.6); border-radius: 12px; padding: 12px; text-align: center; }
        @media (max-width: 768px) {
            .characters { flex-direction: column; }
            .vs { display: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">⚔️ Anime vs Skibidi ⚔️</div>
            <div class="currency">
                <div class="coin">🪙 <span id="coins">0</span></div>
                <div class="gem">💎 <span id="gems">0</span></div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="fight">⚔️ Бой</button>
            <button class="tab-btn" data-tab="cases">📦 Кейсы</button>
            <button class="tab-btn" data-tab="inventory">🎒 Инвентарь</button>
        </div>

        <div id="fight" class="panel active">
            <div id="characterSelector" class="inventory-grid" style="margin-bottom: 20px;"></div>
            <div class="arena">
                <div class="vs">VS</div>
                <div class="characters" id="characters"></div>
                <div id="turnIndicator" class="turn-indicator">⚔️ Нажми "Играть с ботом" ⚔️</div>
                <div class="controls">
                    <button id="attackBtn" class="attack-btn">⚔️ АТАКОВАТЬ</button>
                    <button id="medkitBtn" class="medkit-btn">💊 АПТЕЧКА</button>
                </div>
                <div id="fightMessage" class="message"></div>
            </div>
            <button id="botBtn" class="bot-btn">🤖 ИГРАТЬ С БОТОМ</button>
            <button id="resetBtn" class="reset-btn">🔄 СБРОСИТЬ ПРОГРЕСС</button>
        </div>

        <div id="cases" class="panel">
            <h3>📦 ОТКРЫТЬ КЕЙС</h3>
            <div class="cases-grid">
                <div class="case-card" data-side="anime" data-price="coins"><div class="case-icon">🎴</div><h4>Anime кейс</h4><p>🪙 500 монет</p></div>
                <div class="case-card" data-side="skibidi" data-price="coins"><div class="case-icon">🚽</div><h4>Skibidi кейс</h4><p>🪙 500 монет</p></div>
                <div class="case-card premium" data-side="anime" data-price="gems"><div class="case-icon">✨</div><h4>Премиум Anime</h4><p>💎 50 гемов</p></div>
                <div class="case-card premium" data-side="skibidi" data-price="gems"><div class="case-icon">✨</div><h4>Премиум Skibidi</h4><p>💎 50 гемов</p></div>
            </div>
            <div id="caseResult" class="message"></div>
        </div>

        <div id="inventory" class="panel">
            <h3>🎒 МОИ ПЕРСОНАЖИ</h3>
            <div id="inventoryList" class="inventory-grid"></div>
        </div>
    </div>

    <script>
        // ========== ДАННЫЕ ПЕРСОНАЖЕЙ ==========
        const charactersData = {
            anime: [
                { id: 'zoro', name: 'Зоро', rarity: 'starter', hp: 2600, maxHp: 2600, damage: 300, hits: 3, side: 'anime' },
                { id: 'naruto', name: 'Наруто', rarity: 'common', hp: 3000, maxHp: 3000, damage: 550, hits: 1, side: 'anime' },
                { id: 'gojo', name: 'Годжо', rarity: 'epic', hp: 12000, maxHp: 12000, damage: 2150, hits: 1, side: 'anime' },
                { id: 'goku', name: 'Гоку', rarity: 'legendary', hp: 18000, maxHp: 18000, damage: 3200, hits: 1, side: 'anime' },
                { id: 'saitama', name: 'Сайтама', rarity: 'mythical', hp: 27000, maxHp: 27000, damage: 4800, hits: 1, side: 'anime' },
                { id: 'aizen', name: 'Айзен', rarity: 'admin', hp: 100000, maxHp: 100000, damage: 18000, hits: 1, side: 'anime' }
            ],
            skibidi: [
                { id: 'camera_men', name: 'Камера Мен', rarity: 'starter', hp: 2600, maxHp: 2600, damage: 450, hits: 1, side: 'skibidi' },
                { id: 'speaker_men', name: 'Спикер Мен', rarity: 'rare', hp: 7500, maxHp: 7500, damage: 1350, hits: 1, side: 'skibidi' },
                { id: 'tv_women', name: 'ТВ Вумен', rarity: 'epic', hp: 10000, maxHp: 10000, damage: 8000, hits: 1, side: 'skibidi' },
                { id: 'titan_siren', name: 'Титан Сирена', rarity: 'ultra', hp: 50000, maxHp: 50000, damage: 9000, hits: 1, side: 'skibidi' }
            ]
        };

        const caseRates = { starter: 40, common: 30, rare: 15, epic: 8, legendary: 4, mythical: 2, secret: 0.8, ultra: 0.2 };

        // ========== СОХРАНЕНИЕ В LOCALSTORAGE ==========
        function saveInventory() {
            localStorage.setItem('anime_skibidi_inventory', JSON.stringify({
                coins: inventory.coins,
                gems: inventory.gems,
                characters: inventory.characters,
                selectedCharacter: inventory.selectedCharacter
            }));
        }

        function loadInventory() {
            const saved = localStorage.getItem('anime_skibidi_inventory');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    inventory.coins = data.coins || 1000;
                    inventory.gems = data.gems || 50;
                    inventory.characters = data.characters || ['zoro', 'camera_men'];
                    inventory.selectedCharacter = data.selectedCharacter || 'zoro';
                } catch(e) {
                    resetInventory();
                }
            } else {
                resetInventory();
            }
        }

        function resetInventory() {
            inventory = {
                coins: 1000,
                gems: 50,
                characters: ['zoro', 'camera_men'],
                selectedCharacter: 'zoro'
            };
            saveInventory();
            updateUI();
            document.getElementById('fightMessage').innerHTML = '🔄 Прогресс сброшен!';
            setTimeout(() => document.getElementById('fightMessage').innerHTML = '', 2000);
        }

        // ========== ИНВЕНТАРЬ ==========
        let inventory = { coins: 0, gems: 0, characters: [], selectedCharacter: '' };

        // Состояние боя
        let gameState = null;
        let isMyTurn = false;

        function updateUI() {
            document.getElementById('coins').innerText = inventory.coins;
            document.getElementById('gems').innerText = inventory.gems;
            
            const invDiv = document.getElementById('inventoryList');
            if (invDiv) {
                invDiv.innerHTML = inventory.characters.map(id => {
                    let char = findCharacterById(id);
                    return char ? `<div class="inventory-item"><strong>${char.name}</strong><br>⭐ ${char.rarity}</div>` : '';
                }).join('');
            }
            
            const selector = document.getElementById('characterSelector');
            if (selector && !gameState) {
                selector.innerHTML = inventory.characters.map(id => {
                    let char = findCharacterById(id);
                    const isSelected = inventory.selectedCharacter === id;
                    return char ? `<div class="inventory-item" style="cursor:pointer; ${isSelected ? 'border:2px solid gold' : ''}" onclick="selectCharacter('${id}')"><strong>${char.name}</strong><br>⭐ ${char.rarity}</div>` : '';
                }).join('');
            }
        }

        function findCharacterById(id) {
            for (const char of [...charactersData.anime, ...charactersData.skibidi]) {
                if (char.id === id) return { ...char };
            }
            return null;
        }

        function selectCharacter(id) {
            inventory.selectedCharacter = id;
            saveInventory();
            updateUI();
            document.getElementById('fightMessage').innerHTML = `✅ Выбран персонаж: ${findCharacterById(id).name}`;
            setTimeout(() => document.getElementById('fightMessage').innerHTML = '', 2000);
        }

        function getRandomCharacter(side) {
            const list = charactersData[side];
            const rand = Math.random() * 100;
            let cumulative = 0;
            for (const char of list) {
                cumulative += caseRates[char.rarity] || 1;
                if (rand <= cumulative) return { ...char, hp: char.hp, maxHp: char.maxHp, medkits: 3 };
            }
            return { ...list[0], hp: list[0].hp, maxHp: list[0].maxHp, medkits: 3 };
        }

        function openCase(side, priceType) {
            const cost = priceType === 'coins' ? 500 : 50;
            if (priceType === 'coins' && inventory.coins >= cost) {
                inventory.coins -= cost;
                const char = getRandomCharacter(side);
                inventory.characters.push(char.id);
                saveInventory();
                document.getElementById('caseResult').innerHTML = `🎉 Выпал: <strong>${char.name}</strong> (${char.rarity})! 🎉`;
                updateUI();
                setTimeout(() => document.getElementById('caseResult').innerHTML = '', 3000);
            } else if (priceType === 'gems' && inventory.gems >= cost) {
                inventory.gems -= cost;
                const char = getRandomCharacter(side);
                inventory.characters.push(char.id);
                saveInventory();
                document.getElementById('caseResult').innerHTML = `🎉 Выпал: <strong>${char.name}</strong> (${char.rarity})! 🎉`;
                updateUI();
                setTimeout(() => document.getElementById('caseResult').innerHTML = '', 3000);
            } else {
                document.getElementById('caseResult').innerHTML = '❌ Недостаточно средств!';
                setTimeout(() => document.getElementById('caseResult').innerHTML = '', 2000);
            }
        }

        function createBot() {
            const botChar = charactersData.skibidi[0];
            return {
                id: 'bot',
                name: 'Бот',
                hp: botChar.hp,
                maxHp: botChar.maxHp,
                damage: botChar.damage,
                hits: botChar.hits,
                medkits: 3,
                side: 'skibidi',
                isBot: true
            };
        }

        function startBattle() {
            const char = findCharacterById(inventory.selectedCharacter);
            if (!char) return;
            
            const player = {
                id: 'player',
                name: char.name,
                hp: char.hp,
                maxHp: char.maxHp,
                damage: char.damage,
                hits: char.hits,
                medkits: 3,
                side: char.side,
                isBot: false
            };
            
            const bot = createBot();
            
            gameState = { players: [player, bot], currentTurn: 'player' };
            isMyTurn = true;
            
            updateBattleUI();
            document.getElementById('turnIndicator').innerHTML = '🟢 ВАШ ХОД! 🟢';
            document.getElementById('turnIndicator').style.color = '#2ecc71';
            document.getElementById('fightMessage').innerHTML = 'Бой начался!';
        }

        function updateBattleUI() {
            if (!gameState) return;
            let html = '';
            for (const player of gameState.players) {
                const hpPercent = (player.hp / player.maxHp) * 100;
                const isMe = player.id === 'player';
                html += `<div class="character-card">
                    <div class="character-name">${player.name} ${isMe ? '(ВЫ)' : '(БОТ)'}</div>
                    <div class="hp-bar"><div class="hp-fill" style="width: ${hpPercent}%">${player.hp}/${player.maxHp}</div></div>
                    <div>⚔️ Урон: ${player.damage}</div>
                    <div>💊 Аптечки: ${player.medkits}/3</div>
                </div>`;
            }
            document.getElementById('characters').innerHTML = html;
        }

        function playerAttack() {
            if (!gameState || !isMyTurn) return;
            
            const player = gameState.players.find(p => p.id === 'player');
            const bot = gameState.players.find(p => p.id === 'bot');
            
            const damage = player.damage * (player.hits || 1);
            bot.hp = Math.max(0, bot.hp - damage);
            
            document.getElementById('fightMessage').innerHTML = `⚔️ Вы нанесли ${damage} урона!`;
            
            if (bot.hp <= 0) {
                inventory.coins += 100;
                saveInventory();
                updateUI();
                document.getElementById('fightMessage').innerHTML = `🏆 ПОБЕДА! +100 монет 🏆`;
                gameState = null;
                updateBattleUI();
                document.getElementById('turnIndicator').innerHTML = '⚔️ Нажми "Играть с ботом" ⚔️';
                return;
            }
            
            isMyTurn = false;
            gameState.currentTurn = 'bot';
            updateBattleUI();
            document.getElementById('turnIndicator').innerHTML = '🔴 ХОД БОТА 🔴';
            document.getElementById('turnIndicator').style.color = '#e74c3c';
            
            setTimeout(botTurn, 1000);
        }

        function botTurn() {
            if (!gameState || gameState.currentTurn !== 'bot') return;
            
            const player = gameState.players.find(p => p.id === 'player');
            const bot = gameState.players.find(p => p.id === 'bot');
            
            const damage = bot.damage * (bot.hits || 1);
            player.hp = Math.max(0, player.hp - damage);
            
            document.getElementById('fightMessage').innerHTML = `🤖 Бот нанёс ${damage} урона!`;
            
            if (player.hp <= 0) {
                document.getElementById('fightMessage').innerHTML = `💀 ПОРАЖЕНИЕ! 💀`;
                gameState = null;
                updateBattleUI();
                document.getElementById('turnIndicator').innerHTML = '⚔️ Нажми "Играть с ботом" ⚔️';
                return;
            }
            
            isMyTurn = true;
            gameState.currentTurn = 'player';
            updateBattleUI();
            document.getElementById('turnIndicator').innerHTML = '🟢 ВАШ ХОД! 🟢';
            document.getElementById('turnIndicator').style.color = '#2ecc71';
        }

        function useMedkit() {
            if (!gameState || !isMyTurn) return;
            
            const player = gameState.players.find(p => p.id === 'player');
            if (player.medkits > 0) {
                const heal = Math.floor(player.maxHp * 0.2);
                player.hp = Math.min(player.maxHp, player.hp + heal);
                player.medkits--;
                document.getElementById('fightMessage').innerHTML = `💊 Вы восстановили ${heal} HP! Осталось аптечек: ${player.medkits}`;
                
                isMyTurn = false;
                gameState.currentTurn = 'bot';
                updateBattleUI();
                document.getElementById('turnIndicator').innerHTML = '🔴 ХОД БОТА 🔴';
                document.getElementById('turnIndicator').style.color = '#e74c3c';
                
                setTimeout(botTurn, 1000);
            } else {
                document.getElementById('fightMessage').innerHTML = '❌ Нет аптечек!';
                setTimeout(() => document.getElementById('fightMessage').innerHTML = '', 1000);
            }
        }

        // Инициализация
        loadInventory();
        updateUI();

        document.getElementById('botBtn').onclick = () => startBattle();
        document.getElementById('attackBtn').onclick = () => playerAttack();
        document.getElementById('medkitBtn').onclick = () => useMedkit();
        document.getElementById('resetBtn').onclick = () => resetInventory();

        document.querySelectorAll('.case-card').forEach(card => {
            card.onclick = () => openCase(card.dataset.side, card.dataset.price);
        });

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(btn.dataset.tab).classList.add('active');
            };
        });
    </script>
</body>
</html>
